; UE4SS-settings.ini — deployed to $BIN_DIR/UE4SS-settings.ini
; For the UE4SS experimental build (scripts/install-ue4ss.sh), laid out flat.
; Based on that build's own defaults; changes for a headless dedicated server
; are commented. Keys this file leaves out take UE4SS's built-in defaults.

[Overrides]
; Empty = <folder UE4SS.dll was loaded from>/Mods, i.e. $BIN_DIR/Mods.
ModsFolderPath =
ControllingModsTxt =

[General]
EnableHotReloadSystem = 0
EnableAutoReloadingLuaMods = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
; Upstream default. The scan runs under Wine and takes ~2.5 s per attempt.
SecondsToScanBeforeGivingUp = 120
; Upstream default (false). true was a v3.0.1-era workaround.
bUseUObjectArrayCache = false
bForceGUObjectArrayForIteration = false
DoEarlyScan = 0
bEnableSeachByMemoryAddress = false
; ExecuteInGameThread (H.onGameThread) runs on the engine tick — needs
; HookEngineTick = 1 below.
DefaultExecuteInGameThreadMethod = EngineTick
DefaultFNameToStringMethod = Scan

[EngineVersionOverride]
; Leave empty: UE4SS detects it. Only if UE4SS.log still says
; "Failed to find EngineVersion", set the game's engine version here.
MajorVersion =
MinorVersion =
DebugBuild =
Stats =

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0
UseModuleOffsets = 0

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 0
KeepMemoryLayout = 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[Debug]
; No window on a headless server.
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0

[Threads]
SigScannerNumThreads = 4
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 80

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookInitGameState = 1
HookLoadMap = 1
HookCallFunctionByNameWithArguments = 1
HookBeginPlay = 1
HookEndPlay = 1
; A dedicated server has no local player.
HookLocalPlayerExec = 0
HookAActorTick = 1
HookEngineTick = 1
EngineTickResolveMethod = Scan
; A dedicated server has no viewport.
HookGameViewportClientTick = 0
HookUObjectProcessEvent = 1
HookProcessConsoleExec = 1
HookUStructLink = 1
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0
