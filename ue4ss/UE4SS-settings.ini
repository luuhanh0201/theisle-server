; UE4SS-settings.ini — deployed to $BIN_DIR/ue4ss/UE4SS-settings.ini
; Tuned for a headless dedicated server: no GUI, no dumpers, Lua on.

[Overrides]
ModsFolderPath = Mods

[General]
EnableHotReloadSystem = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 30
UseUObjectArrayCache = 1

[EngineVersionOverride]
MajorVersion =
MinorVersion =

[Debug]
; No window on a headless server.
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
LiveViewObjectsPerGroup = 64

[Threads]
SigScannerNumThreads = 4
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 80

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookInitGameState = 1
HookCallFunctionByNameWithArguments = 1
HookBeginPlay = 1
HookLocalPlayerExec = 0
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 0
