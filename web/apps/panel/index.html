<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isle Server Panel</title>
<link rel="icon" type="image/png" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!-- The theme before the first paint (the same "theme" key as the panel before React): no flash. -->
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }</script>
</head>
<body>
<div id="root"></div>
<!-- The mutation icons, one request for all (portal public/mut-icons.js, served by the bridge): fills img[data-mut-icon]. -->
<script src="/mut-icons.js"></script>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
