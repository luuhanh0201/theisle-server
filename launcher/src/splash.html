<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Xóm Gáy Launcher</title>
<style>
  :root {
    --bg: #07090e; --card: #0b1019; --text: #f1f5f9; --muted: #8b9bb4;
    --emerald: #10b981; --emerald-light: #34d399; --gold: #facc15; --red: #fca5a5;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); }

  .card {
    position: absolute; inset: 0; border-radius: 26px; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #14213a 0%, #0b1019 55%, #07090e 100%);
    border: 1px solid rgba(255,255,255,.07);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-app-region: drag;
    animation: card-in .45s cubic-bezier(.16,1,.3,1) both;
  }
  .card.out { animation: card-out .35s ease-in forwards; }
  @keyframes card-in { from { opacity: 0; transform: scale(.94); } }
  @keyframes card-out { to { opacity: 0; transform: scale(1.04); } }

  /* Drifting embers behind the logo. */
  .ember { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0; filter: blur(.5px); animation: ember 5s linear infinite; }
  .ember:nth-child(1) { left: 18%; animation-delay: .6s; }
  .ember:nth-child(2) { left: 34%; animation-delay: 2.1s; width: 3px; height: 3px; }
  .ember:nth-child(3) { left: 52%; animation-delay: 1.2s; }
  .ember:nth-child(4) { left: 67%; animation-delay: 3s; width: 3px; height: 3px; }
  .ember:nth-child(5) { left: 82%; animation-delay: 1.7s; }
  @keyframes ember {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: .8; }
    100% { transform: translateY(-470px) translateX(24px); opacity: 0; }
  }

  .stage { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold);
    opacity: 0; animation: ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite; animation-delay: .9s;
  }
  .ring.r2 { animation-delay: 1.7s; border-color: var(--emerald-light); }
  @keyframes ripple {
    0% { transform: scale(.8); opacity: .7; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .glow {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(250,204,21,.35) 0%, rgba(250,204,21,0) 70%);
    animation: glow 2.6s ease-in-out infinite; animation-delay: .9s; opacity: 0;
  }
  @keyframes glow { 0%, 100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  .logo {
    position: relative; width: 170px; height: 170px; border-radius: 50%;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 3px rgba(250,204,21,.25);
    animation: logo-in .9s cubic-bezier(.34,1.56,.64,1) both, float 3.2s ease-in-out 1s infinite;
  }
  @keyframes logo-in {
    0% { opacity: 0; transform: scale(.4) rotate(-14deg); filter: blur(6px); }
    60% { opacity: 1; filter: blur(0); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  h1 { margin: 26px 0 2px; font-size: 30px; font-weight: 900; letter-spacing: .08em; display: flex; gap: 2px; }
  h1 span { display: inline-block; opacity: 0; transform: translateY(14px); animation: letter .5s cubic-bezier(.16,1,.3,1) forwards; }
  h1 span.gold { color: var(--gold); }
  h1 span.gap { width: 12px; }
  @keyframes letter { to { opacity: 1; transform: none; } }
  .sub { color: var(--muted); font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; animation: fade .6s ease 1.25s forwards; }
  @keyframes fade { to { opacity: 1; } }

  .bar { position: relative; width: 220px; height: 4px; margin-top: 28px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; opacity: 0; animation: fade .4s ease 1.3s forwards; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--emerald-light), transparent); animation: slide 1.2s ease-in-out infinite; }
  .bar.done i { width: 100%; left: 0; animation: none; background: var(--emerald); transition: width .3s; }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; opacity: 0; animation: fade .4s ease 1.35s forwards; }

  .error { margin-top: 18px; text-align: center; -webkit-app-region: no-drag; }
  .error p { color: var(--red); margin: 0 0 12px; font-weight: 600; }
  .error button { font: inherit; font-weight: 800; padding: 8px 18px; border-radius: 9px; border: 0; cursor: pointer; margin: 0 4px; }
  .error .retry { background: var(--emerald); color: #041f14; }
  .error .quit { background: rgba(255,255,255,.08); color: var(--text); }
  .version { position: absolute; bottom: 12px; font-size: 11px; color: rgba(139,155,180,.6); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    h1 span, .sub, .bar, .status { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div>
    <div class="stage">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="ring r2"></div>
      <img class="logo" src="logo-360.png" alt="Xóm Gáy" width="170" height="170">
    </div>
    <h1 id="title" aria-label="Xóm Gáy"></h1>
    <div class="sub">The Isle Evrima · Launcher</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="status" id="status">Đang kết nối máy chủ…</div>
    <div class="error" id="error" hidden>
      <p id="error-text">Không kết nối được máy chủ.</p>
      <button type="button" class="retry" id="retry">Thử lại</button>
      <button type="button" class="quit" id="quit">Thoát</button>
    </div>
    <div class="version" id="version"></div>
  </div>
  <script src="splash-page.js"></script>
</body>
</html>
