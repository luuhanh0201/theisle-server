<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Reniculate Kidneys - The Isle Evrima Mutation</title>
  <desc>Uống được nước mặn. Thanh khát 1.000; lượng nước nhận được khi uống nước mặn: −2,5%.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_reniculate-kidneys" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_reniculate-kidneys" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_reniculate-kidneys" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_reniculate-kidneys" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_reniculate-kidneys)"
           stroke="url(#strokeGrad_reniculate-kidneys)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_reniculate-kidneys)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_reniculate-kidneys)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Marine Multilobed Kidney Filtering Sea Salt from Ocean Waves -->
      <g transform="translate(128,128)">
        <!-- Ocean Waves (Saltwater) -->
        <path d="M-46,30 Q-24,20 0,30 Q24,40 46,30" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-46,40 Q-24,30 0,40 Q24,50 46,40" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
        <!-- Reniculate Multi-Lobular Kidney Silhouette -->
        <!-- Lobules clustered like grapes -->
        <circle cx="-14" cy="-18" r="11" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="8" cy="-22" r="12" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="-20" cy="2" r="12" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="2" cy="-2" r="13" fill="#d97706" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="20" cy="-4" r="11" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="-8" cy="18" r="11" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="14" cy="16" r="11" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
        <!-- Filtered Sea Salt Crystals Blocked Outside -->
        <rect x="-38" y="-36" width="10" height="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" transform="rotate(25 -33 -31)"/>
        <rect x="28" y="-36" width="8" height="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" transform="rotate(45 32 -32)"/>
        <!-- Pure Water Droplet Emerging from filter -->
        <circle cx="0" cy="2" r="4" fill="#38bdf8"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
