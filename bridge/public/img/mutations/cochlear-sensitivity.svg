<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Cochlear Sensitivity - The Isle Evrima Mutation</title>
  <desc>Nhận biết bẫy âm thanh từ xa.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_cochlear-sensitivity" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_cochlear-sensitivity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_cochlear-sensitivity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_cochlear-sensitivity" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_cochlear-sensitivity)"
           stroke="url(#strokeGrad_cochlear-sensitivity)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_cochlear-sensitivity)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#c084fc"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_cochlear-sensitivity)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Spiral Cochlea Inner Ear Sensing Distant Sound Traps -->
      <g transform="translate(128,128)">
        <!-- Intricate Cochlea Hearing Spiral -->
        <path d="M0,0 C-10,0 -16,-8 -14,-18 C-12,-28 0,-36 16,-34 C32,-32 42,-14 38,8 C34,28 10,42 -14,40 C-36,38 -50,14 -44,-14" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="6" fill="#a855f7"/>
        <!-- Tripwire / Trap Warning Resonance Arcs -->
        <path d="M24,-38 A48,48 0 0,1 46,-16" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
        <path d="M32,-46 A60,60 0 0,1 56,-20" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,4"/>
        <!-- Sound Trap Alert Spark -->
        <polygon points="46,-34 49,-28 55,-26 49,-24 46,-18 43,-24 37,-26 43,-28" fill="#facc15"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#d8b4fe" text-anchor="middle" letter-spacing="1">TEST BUILD</text>
</svg>
