<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Gastronomic Regeneration - The Isle Evrima Mutation</title>
  <desc>Ăn hồi lại một ít máu.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_gastronomic-regeneration" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_gastronomic-regeneration" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_gastronomic-regeneration" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_gastronomic-regeneration" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_gastronomic-regeneration)"
           stroke="url(#strokeGrad_gastronomic-regeneration)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_gastronomic-regeneration)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#10b981"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_gastronomic-regeneration)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Delicious Meat Morsel Emitting Rejuvenating Health Cross Sparks -->
      <g transform="translate(128,128)">
        <!-- Meat Steak Silhouette with Bone -->
        <path d="M-28,-14 C-36,6 -20,32 6,32 C28,32 40,16 34,-6 C28,-26 4,-34 -14,-26 C-20,-24 -24,-20 -28,-14 Z" fill="#b91c1c" stroke="#f87171" stroke-width="3.5"/>
        <!-- Marbling meat grain -->
        <path d="M-18,-6 C-4,10 14,8 24,0" stroke="#fecaca" stroke-width="3" fill="none"/>
        <path d="M-8,-16 C2,-2 18,2 24,14" stroke="#fecaca" stroke-width="2.5" fill="none"/>
        <!-- Marrow Bone Core -->
        <circle cx="-12" cy="0" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
        <circle cx="-12" cy="0" r="3.5" fill="#94a3b8"/>
        <!-- Health Regen Plus (+) Sparks -->
        <g transform="translate(24,-24)">
          <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#22c55e"/>
          <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#22c55e"/>
          <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        </g>
        <g transform="translate(-28,24) scale(0.65)">
          <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#22c55e"/>
          <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#22c55e"/>
        </g>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
