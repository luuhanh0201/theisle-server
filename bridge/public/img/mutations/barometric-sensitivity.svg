<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Barometric Sensitivity - The Isle Evrima Mutation</title>
  <desc>Được báo trước khi sắp có bão hoặc hạn hán.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_barometric-sensitivity" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_barometric-sensitivity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_barometric-sensitivity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_barometric-sensitivity" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_barometric-sensitivity)"
           stroke="url(#strokeGrad_barometric-sensitivity)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_barometric-sensitivity)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#22c55e"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_barometric-sensitivity)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Barometer Gauge Sensing Storm Lightning and Drought -->
      <g transform="translate(128,128)">
        <!-- Barometer Dial Face -->
        <circle cx="0" cy="6" r="42" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
        <!-- Dial Scale Arc -->
        <path d="M-30,6 A30,30 0 0,1 30,6" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="3,6"/>
        <!-- Storm Cloud & Lightning on Left -->
        <path d="M-28,-22 C-34,-22 -36,-18 -36,-14 C-36,-10 -32,-6 -26,-6 L-14,-6 C-10,-6 -6,-10 -6,-14 C-6,-22 -14,-22 -18,-24 C-20,-28 -26,-28 -28,-22 Z" fill="#475569"/>
        <polygon points="-22,-4 -26,6 -20,6 -24,14 -16,2 -20,2" fill="#38bdf8"/>
        <!-- Sun (Drought) on Right -->
        <circle cx="22" cy="-16" r="8" fill="#f59e0b"/>
        <!-- Compass / Barometer Pivot Needle -->
        <circle cx="0" cy="6" r="6" fill="#f8fafc"/>
        <polygon points="0,4 -4,6 -18,-20 0,-16" fill="#ef4444"/>
        <polygon points="0,8 4,6 18,24 0,20" fill="#94a3b8"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
