<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Reinforced Tendons - The Isle Evrima Mutation</title>
  <desc>Nhảy tốn ít stamina hơn; với Pteranodon thì cất cánh tốn ít stamina hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_reinforced-tendons" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_reinforced-tendons" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_reinforced-tendons" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_reinforced-tendons" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_reinforced-tendons)"
           stroke="url(#strokeGrad_reinforced-tendons)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_reinforced-tendons)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_reinforced-tendons)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Powerful Ankle Tendon Spring Releasing Explosive Jump Arrow -->
      <g transform="translate(128,128)">
        <!-- High-Jump Kinetic Upward Arrows -->
        <path d="M0,-48 L0,-18" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
        <polygon points="0,-54 -8,-38 8,-38" fill="#f59e0b"/>
        <!-- Explosive Jump Trail -->
        <path d="M-18,-30 L-10,-18" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <path d="M18,-30 L10,-18" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <!-- Biomechanical Ankle Joint Bone Structure -->
        <path d="M-16,-10 L-6,14 L-24,38 L-8,40 L4,20 L2,-10 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
        <!-- Coiled High-Tension Tendon Spring -->
        <path d="M-6,0 C6,-4 18,4 10,12 C2,20 18,24 10,32 C2,40 14,44 6,48" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
