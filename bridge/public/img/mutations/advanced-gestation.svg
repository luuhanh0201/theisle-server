<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Advanced Gestation - The Isle Evrima Mutation</title>
  <desc>Mang trứng, ấp trứng và thời gian hồi (cooldown) nhanh hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_advanced-gestation" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_advanced-gestation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_advanced-gestation" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_advanced-gestation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_advanced-gestation)"
           stroke="url(#strokeGrad_advanced-gestation)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_advanced-gestation)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#818cf8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_advanced-gestation)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Dinosaur Egg in Nest with Accelerated Maternal Spiral Glow -->
      <g transform="translate(128,128)">
        <!-- Warm Nest Base -->
        <path d="M-42,16 C-30,42 30,42 42,16 C30,32 -30,32 -42,16 Z" fill="#78350f" stroke="#b45309" stroke-width="3"/>
        <path d="M-38,20 L-28,34 L-14,24 L0,36 L16,24 L30,34 L38,20" fill="none" stroke="#d97706" stroke-width="3"/>
        <!-- Spotted Dinosaur Egg -->
        <path d="M0,-34 C-20,-34 -24,2 -24,18 C-24,30 -12,32 0,32 C12,32 24,30 24,18 C24,2 20,-34 0,-34 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="3.5"/>
        <!-- Egg Spots -->
        <circle cx="-8" cy="-6" r="4" fill="#fde68a"/>
        <circle cx="8" cy="8" r="5" fill="#fde68a"/>
        <circle cx="-10" cy="18" r="3" fill="#fde68a"/>
        <circle cx="6" cy="-18" r="3" fill="#fde68a"/>
        <!-- Incubation Time Speed Vortex Spiral -->
        <path d="M-30,-10 A34,34 0 1,1 0,44" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6,4"/>
        <polygon points="-32,-4 -28,-14 -38,-10" fill="#ec4899"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
