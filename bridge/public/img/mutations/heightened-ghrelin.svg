<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Heightened Ghrelin - The Isle Evrima Mutation</title>
  <desc>Ăn quá no (overeat) được nhiều hơn hẳn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_heightened-ghrelin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_heightened-ghrelin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_heightened-ghrelin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_heightened-ghrelin" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_heightened-ghrelin)"
           stroke="url(#strokeGrad_heightened-ghrelin)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_heightened-ghrelin)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_heightened-ghrelin)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Distended Stomach Expanding Past Boundary Limits with Expansion Arrows -->
      <g transform="translate(128,128)">
        <!-- Normal Stomach Boundary (Dashed Limit) -->
        <ellipse cx="0" cy="0" rx="26" ry="24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4,4"/>
        <!-- Massively Distended Gaping Stomach (>120% capacity) -->
        <path d="M-8,-44 C24,-48 48,-24 48,8 C48,36 24,46 -8,46 C-36,46 -48,28 -48,4 C-48,-20 -30,-40 -8,-44 Z" fill="#b45309" stroke="#f59e0b" stroke-width="4"/>
        <path d="M-6,-36 C20,-40 38,-20 38,6 C38,28 18,36 -6,36 C-28,36 -38,22 -38,2 C-38,-16 -24,-32 -6,-36 Z" fill="#78350f"/>
        <!-- Outward Overflow Stretch Arrows -->
        <path d="M38,4 L48,4" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
        <polygon points="52,4 44,0 44,8" fill="#fde047"/>
        <path d="M-38,4 L-48,4" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
        <polygon points="-52,4 -44,0 -44,8" fill="#fde047"/>
        <path d="M0,36 L0,46" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
        <polygon points="0,50 -4,42 4,42" fill="#fde047"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
