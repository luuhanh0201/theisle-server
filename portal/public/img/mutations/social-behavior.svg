<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Social Behavior - The Isle Evrima Mutation</title>
  <desc>Tăng giới hạn số thành viên trong nhóm. Chỉ có tác dụng với trưởng nhóm.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_social-behavior" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_social-behavior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_social-behavior" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a2e05" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_social-behavior" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_social-behavior)"
           stroke="url(#strokeGrad_social-behavior)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_social-behavior)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#84cc16"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_social-behavior)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Dino Pack Formation with Alpha Crown and Plus (+) Size -->
      <g transform="translate(128,128)">
        <!-- Left Subordinate Dino Silhouette -->
        <path d="M-38,28 C-38,10 -28,2 -20,2 C-16,2 -14,6 -16,16 L-14,28 Z" fill="#4d7c0f"/>
        <circle cx="-22" cy="0" r="5" fill="#4d7c0f"/>
        <!-- Right Subordinate Dino Silhouette -->
        <path d="M38,28 C38,10 28,2 20,2 C16,2 14,6 16,16 L14,28 Z" fill="#4d7c0f"/>
        <circle cx="22" cy="0" r="5" fill="#4d7c0f"/>
        <!-- Center Alpha Leader Dino -->
        <path d="M-18,36 C-18,6 -4,-6 0,-6 C4,-6 18,6 18,36 Z" fill="#84cc16" stroke="#a3e635" stroke-width="3"/>
        <circle cx="0" cy="-14" r="9" fill="#84cc16" stroke="#a3e635" stroke-width="2"/>
        <!-- Alpha Crown / Crest -->
        <polygon points="-12,-26 -6,-36 0,-28 6,-36 12,-26" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
        <!-- Plus (+) Group Size Sign -->
        <rect x="20" y="-34" width="8" height="24" rx="2" fill="#facc15"/>
        <rect x="12" y="-26" width="24" height="8" rx="2" fill="#facc15"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
