<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Osteosclerosis - The Isle Evrima Mutation</title>
  <desc>Chống gãy xương, hoặc giảm sát thương gãy xương.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_osteosclerosis" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_osteosclerosis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_osteosclerosis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_osteosclerosis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_osteosclerosis)"
           stroke="url(#strokeGrad_osteosclerosis)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_osteosclerosis)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#94a3b8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_osteosclerosis)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Heavy Dense Cortical Bone with Fracture Armor Shield -->
      <g transform="translate(128,128)">
        <!-- Protective Shield Aura -->
        <polygon points="0,-48 42,-24 42,20 0,48 -42,20 -42,-24" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
        <!-- Heavy Dense Femur Bone -->
        <!-- Top Knobs -->
        <circle cx="-16" cy="-28" r="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
        <circle cx="16" cy="-28" r="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
        <!-- Bottom Knobs -->
        <circle cx="-16" cy="28" r="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
        <circle cx="16" cy="28" r="14" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
        <!-- Bone Shaft -->
        <path d="M-10,-24 L-8,24 L8,24 L10,-24 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
        <rect x="-4" y="-20" width="8" height="40" fill="#ffffff"/>
        <!-- Reinforcement Steel Bands -->
        <rect x="-14" y="-6" width="28" height="6" rx="2" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
        <rect x="-14" y="6" width="28" height="6" rx="2" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
