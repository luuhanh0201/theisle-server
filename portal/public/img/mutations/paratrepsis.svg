<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Paratrepsis - The Isle Evrima Mutation</title>
  <desc>Giả vờ bị gãy xương được.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_paratrepsis" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_paratrepsis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_paratrepsis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_paratrepsis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_paratrepsis)"
           stroke="url(#strokeGrad_paratrepsis)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_paratrepsis)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#c084fc"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_paratrepsis)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Feigning Broken Bone Masquerade Trickster Mask -->
      <g transform="translate(128,128)">
        <!-- Theatrical Deception Mask -->
        <path d="M-32,-24 C-18,-34 18,-34 32,-24 C38,-8 34,24 0,36 C-34,24 -38,-8 -32,-24 Z" fill="#2e1065" stroke="#c084fc" stroke-width="3.5"/>
        <!-- Mask Eye Holes -->
        <ellipse cx="-14" cy="-10" rx="7" ry="5" fill="#facc15" transform="rotate(-15 -14 -10)"/>
        <ellipse cx="14" cy="-10" rx="7" ry="5" fill="#facc15" transform="rotate(15 14 -10)"/>
        <!-- Playful Smirk -->
        <path d="M-14,14 Q0,24 16,10" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
        <!-- Faux Fracture Bone Line Overlaid -->
        <path d="M-40,32 L-20,24 L0,28 L20,24 L40,32" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
        <path d="M-4,24 L0,20 L4,24" stroke="#ef4444" stroke-width="2.5" fill="none"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#d8b4fe" text-anchor="middle" letter-spacing="1">TEST BUILD</text>
</svg>
