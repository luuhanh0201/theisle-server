<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Accelerated Prey Drive - The Isle Evrima Mutation</title>
  <desc>Gây thêm sát thương lên con vật còn dưới 35% máu.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_accelerated-prey-drive" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_accelerated-prey-drive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_accelerated-prey-drive" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_accelerated-prey-drive" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_accelerated-prey-drive)"
           stroke="url(#strokeGrad_accelerated-prey-drive)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_accelerated-prey-drive)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#ef4444"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_accelerated-prey-drive)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Heartbeat EKG dipping to <35% with Locked Execution Crosshairs -->
      <g transform="translate(128,128)">
        <!-- Reticle Crosshairs -->
        <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,6"/>
        <line x1="-48" y1="0" x2="-34" y2="0" stroke="#ef4444" stroke-width="3.5"/>
        <line x1="34" y1="0" x2="48" y2="0" stroke="#ef4444" stroke-width="3.5"/>
        <line x1="0" y1="-48" x2="0" y2="-34" stroke="#ef4444" stroke-width="3.5"/>
        <line x1="0" y1="34" x2="0" y2="48" stroke="#ef4444" stroke-width="3.5"/>
        <!-- Critical Heartbeat Monitor Line (<35% health) -->
        <path d="M-34,8 L-16,8 L-10,-24 L-2,32 L6,-8 L14,8 L34,8" fill="none" stroke="#fca5a5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Razor Predator Teeth / Bite Marks -->
        <polygon points="-16,-28 -8,-28 -12,-14" fill="#fee2e2"/>
        <polygon points="8,-28 16,-28 12,-14" fill="#fee2e2"/>
        <polygon points="-16,28 -8,28 -12,14" fill="#fee2e2"/>
        <polygon points="8,28 16,28 12,14" fill="#fee2e2"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
