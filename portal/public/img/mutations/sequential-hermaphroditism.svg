<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Sequential Hermaphroditism - The Isle Evrima Mutation</title>
  <desc>Đổi giới tính của bạn. Mutation này không di truyền cho con.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_sequential-hermaphroditism" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_sequential-hermaphroditism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_sequential-hermaphroditism" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_sequential-hermaphroditism" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_sequential-hermaphroditism)"
           stroke="url(#strokeGrad_sequential-hermaphroditism)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_sequential-hermaphroditism)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#818cf8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_sequential-hermaphroditism)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Intertwined Mars (♂) and Venus (♀) Biological Gender Transition -->
      <g transform="translate(128,128)">
        <!-- Center Shared Intersecting Ring -->
        <circle cx="0" cy="0" r="26" fill="#312e81" stroke="#818cf8" stroke-width="4"/>
        <circle cx="0" cy="0" r="16" fill="#1e1b4b"/>
        <!-- Mars (Male) Arrow Top-Right -->
        <line x1="18" y1="-18" x2="38" y2="-38" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
        <polyline points="24,-38 38,-38 38,-24" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Venus (Female) Cross Bottom-Left -->
        <line x1="-18" y1="18" x2="-34" y2="34" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
        <line x1="-40" y1="24" x2="-26" y2="38" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
        <!-- Circular Transition Arrows in Center -->
        <path d="M-8,-10 A12,12 0 0,1 10,-6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <polygon points="12,-10 14,-4 8,-6" fill="#fbbf24"/>
        <path d="M8,10 A12,12 0 0,1 -10,6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <polygon points="-12,10 -14,4 -8,6" fill="#fbbf24"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
