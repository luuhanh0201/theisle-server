<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Congenital Hypoalgesia - The Isle Evrima Mutation</title>
  <desc>Giảm sát thương nhận vào khi đánh nhau với loài to hơn mình.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_congenital-hypoalgesia" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_congenital-hypoalgesia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_congenital-hypoalgesia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_congenital-hypoalgesia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_congenital-hypoalgesia)"
           stroke="url(#strokeGrad_congenital-hypoalgesia)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_congenital-hypoalgesia)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#94a3b8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_congenital-hypoalgesia)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Tower Shield Deflecting Incoming Claws -->
      <g transform="translate(128,128)">
        <!-- Shield Body -->
        <path d="M-36,-44 L36,-44 L34,8 C32,36 10,48 0,54 C-10,48 -32,36 -34,8 Z" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
        <path d="M-26,-36 L26,-36 L24,6 C22,28 8,38 0,44 C-8,38 -22,28 -24,6 Z" fill="#1e293b"/>
        <!-- Shield Boss & Rivets -->
        <circle cx="0" cy="-2" r="14" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
        <circle cx="0" cy="-2" r="5" fill="#f8fafc"/>
        <circle cx="-20" cy="-30" r="3" fill="#cbd5e1"/>
        <circle cx="20" cy="-30" r="3" fill="#cbd5e1"/>
        <!-- Incoming Claw Deflection Spark -->
        <path d="M-48,-24 L-28,-14 L-42,-2" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
        <polygon points="-24,-12 -16,-22 -14,-10 -6,-14 -12,-4 -10,6 -20,0" fill="#fbbf24"/>
        <!-- Shock Deflection Rings -->
        <path d="M-18,-30 A38,38 0 0,0 -22,24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
