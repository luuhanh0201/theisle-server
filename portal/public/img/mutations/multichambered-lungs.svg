<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Multichambered Lungs - The Isle Evrima Mutation</title>
  <desc>Tăng ngưỡng hồi stamina.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_multichambered-lungs" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_multichambered-lungs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_multichambered-lungs" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_multichambered-lungs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_multichambered-lungs)"
           stroke="url(#strokeGrad_multichambered-lungs)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_multichambered-lungs)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_multichambered-lungs)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Avian Multichambered Air Sac Respiratory System -->
      <g transform="translate(128,128)">
        <!-- Trachea Central Pipe -->
        <rect x="-5" y="-46" width="10" height="28" rx="2" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
        <!-- Anterior Air Sacs (Top L/R) -->
        <circle cx="-24" cy="-14" r="14" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
        <circle cx="24" cy="-14" r="14" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
        <!-- Main Pulmonary Lungs (Middle L/R) -->
        <ellipse cx="-16" cy="10" rx="14" ry="18" fill="#92400e" stroke="#fbbf24" stroke-width="3"/>
        <ellipse cx="16" cy="10" rx="14" ry="18" fill="#92400e" stroke="#fbbf24" stroke-width="3"/>
        <!-- Posterior Air Sacs (Bottom L/R) -->
        <circle cx="-26" cy="32" r="12" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
        <circle cx="26" cy="32" r="12" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
        <!-- Interconnecting Bronchi Tubes -->
        <line x1="-5" y1="-20" x2="-20" y2="-16" stroke="#fef3c7" stroke-width="3"/>
        <line x1="5" y1="-20" x2="20" y2="-16" stroke="#fef3c7" stroke-width="3"/>
        <line x1="-16" y1="26" x2="-22" y2="30" stroke="#fef3c7" stroke-width="3"/>
        <line x1="16" y1="26" x2="22" y2="30" stroke="#fef3c7" stroke-width="3"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
