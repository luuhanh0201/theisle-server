<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Photosynthetic Tissue - The Isle Evrima Mutation</title>
  <desc>Ban ngày hồi máu và máu bị khoá (locked health) nhanh hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_photosynthetic-tissue" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_photosynthetic-tissue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_photosynthetic-tissue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_photosynthetic-tissue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_photosynthetic-tissue)"
           stroke="url(#strokeGrad_photosynthetic-tissue)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_photosynthetic-tissue)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#818cf8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_photosynthetic-tissue)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Leaf / Plant Cell Lattice Absorbing Sun Energy -->
      <g transform="translate(128,128)">
        <!-- Radiant Sun on Top -->
        <circle cx="0" cy="-32" r="14" fill="#facc15" stroke="#eab308" stroke-width="3"/>
        <line x1="0" y1="-50" x2="0" y2="-44" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <line x1="-16" y1="-44" x2="-11" y2="-39" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <line x1="16" y1="-44" x2="11" y2="-39" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <!-- Photosynthetic Plant Leaf Cell -->
        <path d="M0,-12 C32,2 38,36 0,52 C-38,36 -32,2 0,-12 Z" fill="#15803d" stroke="#22c55e" stroke-width="3.5"/>
        <path d="M0,-8 C22,4 28,30 0,44 C-28,30 -22,4 0,-8 Z" fill="#166534"/>
        <!-- Central Leaf Vein -->
        <line x1="0" y1="-6" x2="0" y2="44" stroke="#86efac" stroke-width="3"/>
        <!-- Lateral Veins -->
        <line x1="0" y1="8" x2="14" y2="2" stroke="#86efac" stroke-width="2"/>
        <line x1="0" y1="18" x2="-14" y2="12" stroke="#86efac" stroke-width="2"/>
        <line x1="0" y1="28" x2="14" y2="22" stroke="#86efac" stroke-width="2"/>
        <!-- Sunlight energy sparkles -->
        <circle cx="-18" cy="-8" r="3" fill="#fef08a"/>
        <circle cx="18" cy="-8" r="3" fill="#fef08a"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
