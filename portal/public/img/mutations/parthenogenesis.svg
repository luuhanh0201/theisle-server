<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Parthenogenesis - The Isle Evrima Mutation</title>
  <desc>Làm tổ được mà không cần bạn đời. Mutation này không di truyền cho con.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_parthenogenesis" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_parthenogenesis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_parthenogenesis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_parthenogenesis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_parthenogenesis)"
           stroke="url(#strokeGrad_parthenogenesis)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_parthenogenesis)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_parthenogenesis)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Solitary Golden Egg Radiating Asexual Mitotic Division Lines -->
      <g transform="translate(128,128)">
        <!-- Nest Silhouette -->
        <path d="M-36,18 C-24,36 24,36 36,18 Z" fill="#78350f" stroke="#b45309" stroke-width="3"/>
        <!-- Radiant Mitotic Halo -->
        <circle cx="0" cy="-6" r="38" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Solitary Luminous Golden Egg -->
        <path d="M0,-34 C-18,-34 -22,2 -22,14 C-22,26 -12,28 0,28 C12,28 22,26 22,14 C22,2 18,-34 0,-34 Z" fill="#fef08a" stroke="#eab308" stroke-width="3.5"/>
        <!-- Mitotic Cleavage Plane Glow -->
        <line x1="0" y1="-32" x2="0" y2="26" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="3,3"/>
        <circle cx="-8" cy="-2" r="5" fill="#fde047"/>
        <circle cx="8" cy="-2" r="5" fill="#fde047"/>
        <!-- Female Symbol Badge ♀ -->
        <g transform="translate(24,-24) scale(0.65)">
          <circle cx="0" cy="0" r="10" fill="none" stroke="#ec4899" stroke-width="3"/>
          <line x1="0" y1="10" x2="0" y2="24" stroke="#ec4899" stroke-width="3"/>
          <line x1="-7" y1="17" x2="7" y2="17" stroke="#ec4899" stroke-width="3"/>
        </g>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
