<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Submerged Optical Retention - The Isle Evrima Mutation</title>
  <desc>Nhìn xa hơn khi ở dưới nước.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_submerged-optical-retention" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_submerged-optical-retention" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_submerged-optical-retention" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_submerged-optical-retention" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_submerged-optical-retention)"
           stroke="url(#strokeGrad_submerged-optical-retention)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_submerged-optical-retention)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#06b6d4"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_submerged-optical-retention)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Underwater Eye with Sonar Vision Beams cutting Through Water Depth -->
      <g transform="translate(128,128)">
        <!-- Water Surface & Deep Waves -->
        <path d="M-48,-36 Q-24,-44 0,-36 Q24,-28 48,-36" fill="none" stroke="#0284c7" stroke-width="3.5"/>
        <path d="M-48,-24 Q-24,-32 0,-24 Q24,-16 48,-24" fill="none" stroke="#0369a1" stroke-width="3"/>
        <!-- Submerged Eye Body -->
        <path d="M-40,6 C-24,28 24,28 40,6 C24,-16 -24,-16 -40,6 Z" fill="#082f49" stroke="#38bdf8" stroke-width="3.5"/>
        <!-- Luminous Cyan Iris -->
        <circle cx="0" cy="6" r="18" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
        <!-- Slit pupil -->
        <ellipse cx="0" cy="6" rx="5" ry="14" fill="#000000"/>
        <circle cx="4" cy="2" r="3" fill="#ffffff"/>
        <!-- Penetrating Sonar Vision Beams -->
        <path d="M16,6 L48,-6" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="3,3"/>
        <path d="M18,6 L48,6" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="4,2"/>
        <path d="M16,6 L48,18" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="3,3"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
