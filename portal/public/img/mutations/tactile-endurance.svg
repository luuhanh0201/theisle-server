<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Tactile Endurance - The Isle Evrima Mutation</title>
  <desc>Chuyển sát thương nhận vào thành stamina.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_tactile-endurance" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_tactile-endurance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_tactile-endurance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_tactile-endurance" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_tactile-endurance)"
           stroke="url(#strokeGrad_tactile-endurance)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_tactile-endurance)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#22c55e"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_tactile-endurance)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Impact Absorbed and Transformed into Pure Stamina Lightning Sparks -->
      <g transform="translate(128,128)">
        <!-- Heavy Breasted Armor Shield -->
        <polygon points="-36,-34 36,-34 28,14 0,34 -28,14" fill="#334155" stroke="#94a3b8" stroke-width="4"/>
        <polygon points="-24,-24 24,-24 18,8 0,22 -18,8" fill="#1e293b"/>
        <!-- Kinetic Impact Shock Point -->
        <circle cx="0" cy="-4" r="10" fill="#f87171" opacity="0.6"/>
        <polygon points="0,-16 4,-8 14,-6 6,0 8,10 0,4 -8,10 -6,0 -14,-6 -4,-8" fill="#ef4444"/>
        <!-- Converted Stamina Lightning Arc Sparks -->
        <polygon points="4,2 -6,18 2,18 -4,44 14,14 4,14" fill="#22c55e" stroke="#86efac" stroke-width="2"/>
        <path d="M-22,-4 L-38,6 L-28,10 L-42,24" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
        <path d="M22,-4 L38,6 L28,10 L42,24" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
