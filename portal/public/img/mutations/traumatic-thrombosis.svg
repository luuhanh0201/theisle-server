<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Traumatic Thrombosis - The Isle Evrima Mutation</title>
  <desc>Không chết vì mất máu khi đang nằm nghỉ.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_traumatic-thrombosis" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_traumatic-thrombosis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_traumatic-thrombosis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_traumatic-thrombosis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_traumatic-thrombosis)"
           stroke="url(#strokeGrad_traumatic-thrombosis)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_traumatic-thrombosis)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#78716c"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_traumatic-thrombosis)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Sleeping Dino Protected by Fibrin Mesh Blood Clot Barrier -->
      <g transform="translate(128,128)">
        <!-- Resting / Sleeping Dino Silhouette -->
        <path d="M-28,18 C-34,6 -18,-8 0,-8 C18,-8 34,6 28,18 C20,26 -20,26 -28,18 Z" fill="#57534e" stroke="#78716c" stroke-width="2.5"/>
        <circle cx="-16" cy="4" r="2.5" fill="#a8a29e"/>
        <!-- Sleep Zzz Indicator -->
        <text x="22" y="-12" font-family="sans-serif" font-weight="bold" font-size="16" fill="#a8a29e">z</text>
        <text x="32" y="-22" font-family="sans-serif" font-weight="bold" font-size="12" fill="#78716c">z</text>
        <!-- Blood Vessel Thrombus / Fibrin Mesh Barrier Halting Hemorrhage -->
        <path d="M-36,-24 C-18,-38 18,-38 36,-24 C30,-8 10,-2 0,-2 C-10,-2 -30,-8 -36,-24 Z" fill="#991b1b" opacity="0.6"/>
        <path d="M-30,-22 L-10,-12 L10,-24 L28,-14" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
        <!-- Red Diagonal Slash (Removed Status) -->
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#f87171" text-anchor="middle" letter-spacing="1">REMOVED</text>
</svg>
