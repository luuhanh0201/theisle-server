<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Hypervigilance - The Isle Evrima Mutation</title>
  <desc>Góc camera rộng hơn khi đang ăn và uống. Nghe tiếng bước chân của con khác to hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_hypervigilance" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_hypervigilance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_hypervigilance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_hypervigilance" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_hypervigilance)"
           stroke="url(#strokeGrad_hypervigilance)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_hypervigilance)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#22c55e"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_hypervigilance)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Wide Panoramic 270 Radar Field of View with Sound Ears -->
      <g transform="translate(128,128)">
        <!-- Acoustic Listening Waves -->
        <path d="M-36,-26 A46,46 0 0,0 -36,26" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-44,-36 A58,58 0 0,0 -44,36" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M36,-26 A46,46 0 0,1 36,26" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M44,-36 A58,58 0 0,1 44,36" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Wide Panoramic Eye -->
        <path d="M-30,0 C-18,22 18,22 30,0 C18,-22 -18,-22 -30,0 Z" fill="#0f172a" stroke="#86efac" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="15" fill="#4ade80"/>
        <circle cx="0" cy="0" r="7" fill="#052e16"/>
        <circle cx="3" cy="-3" r="3" fill="#ffffff"/>
        <!-- Radar Scan Arc sweep -->
        <path d="M0,0 L-24,-30 A38,38 0 0,1 24,-30 Z" fill="#22c55e" opacity="0.25"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
