<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Intraspecific Aggression - The Isle Evrima Mutation</title>
  <desc>Gây thêm sát thương lên con cùng loài.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_intraspecific-aggression" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_intraspecific-aggression" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_intraspecific-aggression" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_intraspecific-aggression" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_intraspecific-aggression)"
           stroke="url(#strokeGrad_intraspecific-aggression)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_intraspecific-aggression)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#78716c"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_intraspecific-aggression)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Two Same-Species Dinosaur Skulls Clashing Head-On with Red Ban Slash -->
      <g transform="translate(128,128)">
        <!-- Left Dinosaur Head -->
        <path d="M-42,16 C-38,-6 -24,-18 -6,-16 L-8,-4 L-20,-2 L-28,16 Z" fill="#78716c" stroke="#a8a29e" stroke-width="2.5"/>
        <circle cx="-16" cy="-10" r="3" fill="#ef4444"/>
        <!-- Right Dinosaur Head (Same species silhouette) -->
        <path d="M42,16 C38,-6 24,-18 6,-16 L8,-4 L20,-2 L28,16 Z" fill="#78716c" stroke="#a8a29e" stroke-width="2.5"/>
        <circle cx="16" cy="-10" r="3" fill="#ef4444"/>
        <!-- Impact Clash Spark -->
        <polygon points="0,-24 4,-14 14,-10 6,-4 8,6 0,0 -8,6 -6,-4 -14,-10 -4,-14" fill="#f59e0b"/>
        <!-- Red Diagonal Slash (Removed / Banned Status) -->
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#f87171" text-anchor="middle" letter-spacing="1">REMOVED</text>
</svg>
