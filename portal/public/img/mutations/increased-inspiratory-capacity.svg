<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Increased Inspiratory Capacity - The Isle Evrima Mutation</title>
  <desc>Tăng dung tích oxy (lặn dưới nước được lâu hơn).</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_increased-inspiratory-capacity" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_increased-inspiratory-capacity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_increased-inspiratory-capacity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_increased-inspiratory-capacity" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_increased-inspiratory-capacity)"
           stroke="url(#strokeGrad_increased-inspiratory-capacity)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_increased-inspiratory-capacity)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#06b6d4"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_increased-inspiratory-capacity)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Anatomical Dinosaur Lungs with Oxygen (O2) Bubbles -->
      <g transform="translate(128,128)">
        <!-- Trachea / Windpipe -->
        <rect x="-6" y="-46" width="12" height="26" rx="3" fill="#0891b2" stroke="#67e8f9" stroke-width="2.5"/>
        <line x1="-4" y1="-38" x2="4" y2="-38" stroke="#cffafe" stroke-width="2"/>
        <line x1="-4" y1="-30" x2="4" y2="-30" stroke="#cffafe" stroke-width="2"/>
        <line x1="-4" y1="-22" x2="4" y2="-22" stroke="#cffafe" stroke-width="2"/>
        <!-- Left Lung -->
        <path d="M-6,-22 C-20,-20 -38,-8 -40,14 C-42,32 -30,46 -12,46 C-4,46 -2,38 -4,20 C-4,6 -4,-16 -6,-22 Z" fill="#0e7490" stroke="#22d3ee" stroke-width="3.5"/>
        <path d="M-8,-14 C-18,-12 -30,-2 -32,14 C-34,26 -26,38 -12,38 C-6,38 -5,30 -6,16 Z" fill="#0891b2"/>
        <!-- Right Lung -->
        <path d="M6,-22 C20,-20 38,-8 40,14 C42,32 30,46 12,46 C4,46 2,38 4,20 C4,6 4,-16 6,-22 Z" fill="#0e7490" stroke="#22d3ee" stroke-width="3.5"/>
        <path d="M8,-14 C18,-12 30,-2 32,14 C34,26 26,38 12,38 C6,38 5,30 6,16 Z" fill="#0891b2"/>
        <!-- Oxygen O2 Sparkles -->
        <circle cx="-20" cy="18" r="5" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
        <circle cx="20" cy="18" r="5" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
        <circle cx="0" cy="24" r="7" fill="#67e8f9" stroke="#0e7490" stroke-width="2"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
