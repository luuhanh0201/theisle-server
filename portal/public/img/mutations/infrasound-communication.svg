<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Infrasound Communication - The Isle Evrima Mutation</title>
  <desc>Phát ra ít tiếng ồn hơn hẳn khi nói chuyện trong chat.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_infrasound-communication" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_infrasound-communication" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_infrasound-communication" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_infrasound-communication" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_infrasound-communication)"
           stroke="url(#strokeGrad_infrasound-communication)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_infrasound-communication)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#818cf8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_infrasound-communication)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Low-frequency Concentric Acoustic Waves with Whispering Mask -->
      <g transform="translate(128,128)">
        <!-- Concentric Infrasound Arc Waves -->
        <path d="M-14,-34 A38,38 0 0,0 -14,34" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
        <path d="M-26,-44 A52,52 0 0,0 -26,44" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
        <path d="M-38,-52 A66,66 0 0,0 -38,52" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
        <path d="M14,-34 A38,38 0 0,1 14,34" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
        <path d="M26,-44 A52,52 0 0,1 26,44" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
        <path d="M38,-52 A66,66 0 0,1 38,52" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
        <!-- Central Throat / Voice Syrinx -->
        <circle cx="0" cy="0" r="18" fill="#312e81" stroke="#a5b4fc" stroke-width="3.5"/>
        <circle cx="0" cy="0" r="8" fill="#c7d2fe"/>
        <!-- Stealth Mute Line across mouth -->
        <line x1="-12" y1="12" x2="12" y2="-12" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
