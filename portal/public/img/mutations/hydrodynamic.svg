<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Hydrodynamic - The Isle Evrima Mutation</title>
  <desc>Bơi nhanh hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_hydrodynamic" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_hydrodynamic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_hydrodynamic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_hydrodynamic" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_hydrodynamic)"
           stroke="url(#strokeGrad_hydrodynamic)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_hydrodynamic)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#06b6d4"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_hydrodynamic)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Shark / Marine Reptile Caudal Fin Cutting Water -->
      <g transform="translate(128,128)">
        <!-- Streamlines / Hydro Wake -->
        <path d="M-46,-32 C-20,-30 0,-18 42,-18" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <path d="M-48,0 C-18,0 8,10 44,10" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
        <path d="M-44,30 C-22,30 2,38 40,38" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <!-- Sleek Hydrodynamic Dorsal Fin -->
        <path d="M-30,22 C-14,20 10,-8 18,-42 C14,-22 4,-12 -8,-4 C-16,4 -24,14 -30,22 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="3.5"/>
        <path d="M-22,18 C-10,16 6,-6 12,-32 C10,-18 2,-10 -6,-4 C-12,4 -18,12 -22,18 Z" fill="#e0f2fe"/>
        <!-- Water splash droplets -->
        <circle cx="28" cy="-38" r="3.5" fill="#38bdf8"/>
        <circle cx="38" cy="-28" r="2.5" fill="#bae6fd"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
