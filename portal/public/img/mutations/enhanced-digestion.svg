<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Enhanced Digestion - The Isle Evrima Mutation</title>
  <desc>Các chỉ số dinh dưỡng giảm chậm hơn.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_enhanced-digestion" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_enhanced-digestion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_enhanced-digestion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_enhanced-digestion" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_enhanced-digestion)"
           stroke="url(#strokeGrad_enhanced-digestion)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_enhanced-digestion)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_enhanced-digestion)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Three Nutrient Hexagons (Carbs, Protein, Lipids) Stasis Preservation -->
      <g transform="translate(128,128)">
        <!-- Preservation Triangle Field -->
        <polygon points="0,-44 38,28 -38,28" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
        <!-- Top Node: Carbohydrate (S / Sugar) -->
        <g transform="translate(0,-24)">
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
          <text x="0" y="5" font-size="14" font-weight="bold" fill="#713f12" text-anchor="middle">S</text>
        </g>
        <!-- Bottom Left Node: Protein (|| Lines) -->
        <g transform="translate(-20,16)">
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
          <text x="0" y="5" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">P</text>
        </g>
        <!-- Bottom Right Node: Lipid (Oils) -->
        <g transform="translate(20,16)">
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
          <text x="0" y="5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">L</text>
        </g>
        <!-- Enduring Preservation Lock in Center -->
        <circle cx="0" cy="2" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  <text x="128" y="215" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="1">QUEST UNLOCK</text>
</svg>
