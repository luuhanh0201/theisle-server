<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Epidermal Fibrosis - The Isle Evrima Mutation</title>
  <desc>Tăng khả năng kháng chảy máu.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad_epidermal-fibrosis" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="60%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- Outer Hex Border Gradient -->
    <linearGradient id="strokeGrad_epidermal-fibrosis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Inner Accent Glow Gradient -->
    <radialGradient id="innerGlow_epidermal-fibrosis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow_epidermal-fibrosis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Shadow & Base -->
  <polygon points="128,13 228,70 228,186 128,243 28,186 28,70"
           fill="url(#bgGrad_epidermal-fibrosis)"
           stroke="url(#strokeGrad_epidermal-fibrosis)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#shadow_epidermal-fibrosis)"/>

  <!-- Inner Hexagon Frame Accent -->
  <polygon points="128,25 217,76 217,180 128,231 39,180 39,76"
           fill="none"
           stroke="#94a3b8"
           stroke-width="1.5"
           stroke-opacity="0.35"
           stroke-linejoin="round"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="128" cy="128" r="68" fill="url(#innerGlow_epidermal-fibrosis)"/>

  <!-- Custom Thematic Mutation Artwork -->
  
      <!-- Armored Scale Lattice Defending from Bleed -->
      <g transform="translate(128,128)">
        <!-- Scaled Armor Plate Hexagons -->
        <polygon points="0,-36 20,-24 20,0 0,12 -20,0 -20,-24" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
        <polygon points="-24,2 -4,14 -4,38 -24,50 -44,38 -44,14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
        <polygon points="24,2 44,14 44,38 24,50 4,38 4,14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
        <!-- Central Hardened Node -->
        <polygon points="0,-24 10,-18 10,-6 0,0 -10,-6 -10,-18" fill="#475569"/>
        <!-- Blood Droplet Blocked / Barred -->
        <path d="M0,-8 C0,-8 12,8 12,18 C12,24 6,30 0,30 C-6,30 -12,24 -12,18 C-12,8 0,-8 0,-8 Z" fill="#dc2626"/>
        <circle cx="-3" cy="16" r="3" fill="#fca5a5"/>
        <!-- Anti-Bleed Barrier Ring with Diagonal Slash -->
        <circle cx="0" cy="18" r="20" fill="none" stroke="#22c55e" stroke-width="3.5"/>
        <line x1="-14" y1="32" x2="14" y2="4" stroke="#22c55e" stroke-width="3.5"/>
      </g>
    

  <!-- Status / Category Badge (if applicable) -->
  
</svg>
